name: Shorts Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Unit tests (Shorts feed + filter)
        run: ./gradlew :smarttubetv:testStmobileDebugUnitTest --tests "com.newtube.mobile.ui.shorts.*" --tests "com.newtube.mobile.ui.common.ShortsFilterTest"

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-report_${{ github.sha }}
          path: smarttubetv/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Build stmobileDebug
        run: ./gradlew :smarttubetv:assembleStmobileDebug

      - name: SHA-256 checksums
        run: |
          cd smarttubetv/build/outputs/apk/stmobile/debug
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # One artifact per ABI: no need to download a zip with APKs you cannot use
      # (a 32-bit phone takes the armeabi-v7a one; an arm64 phone the arm64-v8a one;
      # the universal contains both).
      - name: Upload armeabi-v7a APK (32-bit ARM)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_debug_armeabi-v7a_${{ github.sha }}
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64-v8a APK (64-bit ARM)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_debug_arm64-v8a_${{ github.sha }}
          path: smarttubetv/build/outputs/apk/stmobile/debug/*_arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_debug_checksums_${{ github.sha }}
          path: smarttubetv/build/outputs/apk/stmobile/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14