name: Shorts Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build stmobileDebug
        run: ./gradlew :smarttubetv:assembleStmobileDebug

      - name: SHA-256 checksums
        run: |
          cd smarttubetv/build/outputs/apk/stmobile/debug
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_stmobile_debug_${{ github.sha }}
          path: smarttubetv/build/outputs/apk/stmobile/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_stmobile_debug_${{ github.sha }}_checksums
          path: smarttubetv/build/outputs/apk/stmobile/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14